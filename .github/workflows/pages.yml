name: Deploy ratings site

on:
  push:
    branches: [main]
    paths:
      - proa_scraped.xlsx
      - data/proa_stats.json
      - data/overall_model.json
      - assets/PS_out/**
      - site_src/**
      - scripts/build_site.py
      - scripts/overall_model.py
      - scripts/overall_data.py
      - scripts/rating_map_2k5.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl pillow
      - run: python scripts/build_site.py --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
